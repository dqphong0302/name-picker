<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" fill="url(#wheelGrad)" />
  <circle cx="50" cy="50" r="38" fill="#0f172a" />
  <!-- Wheel Segments -->
  <path d="M50 50 L50 12 A38 38 0 0 1 88 50 Z" fill="#38bdf8" opacity="0.85" />
  <path d="M50 50 L88 50 A38 38 0 0 1 50 88 Z" fill="#818cf8" opacity="0.85" />
  <path d="M50 50 L50 88 A38 38 0 0 1 12 50 Z" fill="#f43f5e" opacity="0.85" />
  <path d="M50 50 L12 50 A38 38 0 0 1 50 12 Z" fill="#10b981" opacity="0.85" />
  <!-- Center Star -->
  <circle cx="50" cy="50" r="14" fill="#ffffff" filter="url(#glow)" />
  <polygon points="50,40 53,47 60,47 55,52 57,59 50,55 43,59 45,52 40,47 47,47" fill="#f59e0b" />
  <!-- Pointer on Top -->
  <polygon points="50,14 43,3 57,3" fill="#ef4444" />
</svg>
